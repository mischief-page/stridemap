name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Google Chrome is preinstalled on GitHub's Ubuntu runners; WebKit is not.
      - run: npx playwright install --with-deps webkit
      - run: npm run test:e2e
      - name: Upload the single-file page
        uses: actions/upload-artifact@v4
        with:
          name: stridemap-html
          path: dist-single/stridemap.html
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
