<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>stridemap</title>
    <meta name="description" content="Turn your Apple Health walks and runs into a color-graded spider web of routes. Everything runs in your browser." />
    <link rel="stylesheet" href="/src/web/style.css" />
  </head>
  <body>
    <header>
      <h1>stridemap</h1>
      <p>Every walk and run, starting from the same point. Your data stays in this browser.</p>
    </header>

    <main>
      <aside id="controls">
        <section>
          <h2>Data</h2>
          <label class="drop" id="drop">
            <input type="file" id="file" accept=".zip,application/zip" hidden />
            <strong>Drop export.zip here</strong>
            <span>or click to choose it. On iPhone: Health → your profile → Export All Health Data.</span>
          </label>
          <button type="button" id="sample">Try with sample data</button>
          <p id="status" role="status"></p>
        </section>

        <section>
          <h2>Workouts</h2>
          <fieldset class="row" id="types">
            <label><input type="checkbox" value="running" checked /> Runs</label>
            <label><input type="checkbox" value="walking" checked /> Walks</label>
            <label><input type="checkbox" value="hiking" checked /> Hikes</label>
          </fieldset>
          <div class="row">
            <label>From <input type="date" id="from" /></label>
            <label>To <input type="date" id="to" /></label>
          </div>
          <div class="row presets" id="presets">
            <button type="button" data-range="all">All time</button>
            <button type="button" data-range="12m">Last 12 months</button>
            <button type="button" data-range="this">This year</button>
            <button type="button" data-range="last">Last year</button>
          </div>
        </section>

        <section>
          <h2>Color</h2>
          <fieldset class="row" id="mode">
            <label><input type="radio" name="mode" value="pace" checked /> Pace</label>
            <label><input type="radio" name="mode" value="frequency" /> How often</label>
          </fieldset>
          <div class="row">
            <label>Slow / rare <input type="color" id="colorA" /></label>
            <label>Fast / often <input type="color" id="colorB" /></label>
            <label>Background <input type="color" id="background" /></label>
          </div>
          <label>Blend
            <select id="blend">
              <option value="screen">Glow (dark backgrounds)</option>
              <option value="multiply">Ink (light backgrounds)</option>
              <option value="normal">None</option>
            </select>
          </label>
        </section>

        <section>
          <h2>Shape</h2>
          <label>Fit <output id="fitOut"></output>
            <input type="range" id="fit" min="50" max="100" step="1" value="95" />
            <small>Share of workouts that must fit on the canvas. The rest run off the edge.</small>
          </label>
          <label>Squash long routes <output id="squashOut"></output>
            <input type="range" id="squash" min="0.3" max="1" step="0.05" value="1" />
            <small>1 is true scale. Lower pulls long routes inward, keeping their direction.</small>
          </label>
          <label>Line width <output id="strokeOut"></output>
            <input type="range" id="stroke" min="0.3" max="4" step="0.1" />
          </label>
          <label>Opacity <output id="opacityOut"></output>
            <input type="range" id="opacity" min="0.1" max="1" step="0.05" />
          </label>
          <div class="row">
            <label>Scale
              <select id="scale">
                <option value="bar">Bar</option>
                <option value="rings">Distance rings</option>
                <option value="off">None</option>
              </select>
            </label>
            <label>Units
              <select id="units">
                <option value="km">km</option>
                <option value="mi">miles</option>
              </select>
            </label>
            <label>Color <input type="color" id="scaleColor" /></label>
            <button type="button" id="scaleColorAuto" class="small" hidden>Auto</button>
          </div>
          <small>When long routes are squashed, the scale is drawn as rings, since a bar can't be accurate.</small>
        </section>

        <section>
          <h2>Legend</h2>
          <label class="inline"><input type="checkbox" id="legendShow" /> Show a legend</label>
          <fieldset id="legendFields" disabled>
            <label>Title <input type="text" id="legendTitle" placeholder="e.g. Two years of running" /></label>
            <label>Name <input type="text" id="legendName" placeholder="Your name" /></label>
            <div class="row">
              <label><input type="checkbox" id="legendDates" checked /> Dates shown</label>
              <label>
                <select id="legendDateFormat" aria-label="Date format">
                  <option value="month">Jan 2024 – Aug 2025</option>
                  <option value="day">Jan 3, 2024 – Aug 5, 2025</option>
                  <option value="year">2024 – 2025</option>
                </select>
              </label>
            </div>
            <label>Placement
              <select id="legendPosition">
                <option value="top-left">Top left</option>
                <option value="top-center">Top center</option>
                <option value="top-right">Top right</option>
                <option value="bottom-left">Bottom left</option>
                <option value="bottom-center">Bottom center</option>
                <option value="bottom-right">Bottom right</option>
              </select>
            </label>
            <div class="row">
              <label>Font
                <select id="legendFont">
                  <option value="sans">Sans</option>
                  <option value="serif">Serif</option>
                  <option value="mono">Mono</option>
                  <option value="rounded">Rounded</option>
                </select>
              </label>
              <label>Backdrop
                <select id="legendBackdrop">
                  <option value="halo">Halo</option>
                  <option value="panel">Panel</option>
                  <option value="none">None</option>
                </select>
              </label>
            </div>
            <label>Size <output id="legendSizeOut"></output>
              <input type="range" id="legendSize" min="0.5" max="2" step="0.05" value="1" />
            </label>
            <div class="row">
              <label><input type="checkbox" id="legendCaps" /> Title in capitals</label>
              <label>Color <input type="color" id="legendColor" /></label>
              <button type="button" id="legendColorAuto" class="small" hidden>Auto</button>
            </div>
          </fieldset>
        </section>

        <section class="row">
          <button type="button" id="downloadSvg" disabled>Download SVG</button>
          <button type="button" id="downloadPng" disabled>Download PNG</button>
        </section>
      </aside>

      <figure id="preview" aria-label="Route visualization"></figure>
    </main>

    <script type="module" src="/src/web/main.ts"></script>
  </body>
</html>
